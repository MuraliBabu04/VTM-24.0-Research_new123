name: Run VTM Anchor B2 and B3 - QP22 in Parallel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-anchor-b2-b3-qp22-parallel.yml

permissions:
  contents: read

concurrency:
  group: anchor-b2-b3-qp22-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-input:
    name: Prepare ${{ matrix.sequence }} input
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - sequence: B2_ParkScene
            file: B2_ParkScene_1920x1080_24.yuv
            url: https://drive.google.com/file/d/1T6bD9NgeOSTIHzulcB2LOcxKUBA_eJcg/view
          - sequence: B3_Cactus
            file: B3_Cactus_1920x1080_50.yuv
            url: https://drive.google.com/file/d/19CIbt-C0yFxJAPZSx5JWQsFQ9Hhb13ao/view

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract 32 frames
        env:
          SEQUENCE_URL: ${{ matrix.url }}
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check gdown
          python3 scripts/prepare_class_b_input.py \
            --url "$SEQUENCE_URL" \
            --output "Test_Sequences/$FILE" \
            --frames 32

      - name: Share input
        uses: actions/upload-artifact@v4
        with:
          name: anchor-qp22-input-${{ matrix.sequence }}-32f
          path: Test_Sequences/${{ matrix.file }}
          retention-days: 1
          compression-level: 0

  build-vtm:
    name: Build VTM anchor encoder
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build EncoderApp
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target EncoderApp --parallel 2
          test -x bin/EncoderAppStatic

      - name: Share VTM anchor encoder
        uses: actions/upload-artifact@v4
        with:
          name: anchor-vtm-encoder-b2-b3-qp22
          path: bin/EncoderAppStatic
          retention-days: 1
          compression-level: 0

  anchor:
    name: Anchor ${{ matrix.sequence }} QP22
    needs: [prepare-input, build-vtm]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sequence: [B2_ParkScene, B3_Cactus]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VTM anchor encoder
        uses: actions/download-artifact@v4
        with:
          name: anchor-vtm-encoder-b2-b3-qp22
          path: instrumented-vtm

      - name: Download sequence input
        uses: actions/download-artifact@v4
        with:
          name: anchor-qp22-input-${{ matrix.sequence }}-32f
          path: Test_Sequences

      - name: Run VTM anchor QP22
        env:
          VTM_ENCODER: ${{ github.workspace }}/instrumented-vtm/EncoderAppStatic
        run: |
          set -euo pipefail
          chmod +x "$VTM_ENCODER" scripts/run_anchor_ctc_sequence.sh
          scripts/run_anchor_ctc_sequence.sh "${{ matrix.sequence }}" 22 32

      - name: Add anchor summary
        if: always()
        run: |
          summary="results/Anchor/Class_B/${{ matrix.sequence }}/QP22/${{ matrix.sequence }}_QP22_anchor_summary.txt"
          test ! -f "$summary" || cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload anchor result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-${{ matrix.sequence }}-QP22-32f
          path: results/Anchor/Class_B/${{ matrix.sequence }}/QP22/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
