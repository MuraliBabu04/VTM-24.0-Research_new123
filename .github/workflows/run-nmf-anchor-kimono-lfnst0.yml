name: NMF Study Anchor - Kimono1 - LFNST0 - 32 Frames

on:
  workflow_dispatch:
    inputs:
      sequence_url:
        description: Google Drive URL for B1_Kimono1_1920x1080_24.yuv
        required: false
        default: https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link
        type: string
  push:
    branches: [nmf-vtm-lfnst0]
    paths:
      - .github/workflows/run-nmf-anchor-kimono-lfnst0.yml

permissions:
  contents: read

concurrency:
  group: nmf-anchor-kimono-lfnst0-32f-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Kimono1 input
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download sequence
        env:
          SEQUENCE_URL: ${{ inputs.sequence_url || 'https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link' }}
        run: |
          python3 -m pip install --disable-pip-version-check gdown
          mkdir -p test_sequence
          gdown "$SEQUENCE_URL" -O test_sequence/B1_Kimono1_1920x1080_24.yuv
          actual_size="$(stat -c%s test_sequence/B1_Kimono1_1920x1080_24.yuv)"
          test "$actual_size" -eq 746496000 || {
            echo "Unexpected Kimono1 size: $actual_size; expected 746496000 bytes." >&2
            exit 1
          }

      - name: Share sequence with QP jobs
        uses: actions/upload-artifact@v4
        with:
          name: nmf-study-B1-Kimono1-input
          path: test_sequence/B1_Kimono1_1920x1080_24.yuv
          retention-days: 1
          compression-level: 0

  anchor:
    name: Anchor QP ${{ matrix.qp }} - LFNST0 - 32 Frames
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        qp: [22, 27, 32, 37]

    steps:
      - name: Checkout NMF branch
        uses: actions/checkout@v4

      - name: Download Kimono1 input
        uses: actions/download-artifact@v4
        with:
          name: nmf-study-B1-Kimono1-input
          path: test_sequence

      - name: Verify independent anchor configuration
        shell: bash
        run: |
          chmod +x bin/EncoderAppStatic
          test -x bin/EncoderAppStatic
          test -f cfg/encoder_randomaccess_vtm.cfg
          test -f test_sequence/B1_Kimono1_1920x1080_24.yuv
          test "$(stat -c%s test_sequence/B1_Kimono1_1920x1080_24.yuv)" -eq 746496000
          grep -Eq '^[[:space:]]*GOPSize[[:space:]]*:[[:space:]]*32([[:space:]]|$)' cfg/encoder_randomaccess_vtm.cfg

      - name: Run unmodified VTM anchor
        shell: bash
        run: |
          qp="${{ matrix.qp }}"
          out="nmf_results/anchor/B1_Kimono1/QP$qp"
          mkdir -p "$out"
          ./bin/EncoderAppStatic \
            -c cfg/encoder_randomaccess_vtm.cfg \
            -i test_sequence/B1_Kimono1_1920x1080_24.yuv \
            -wdt 1920 -hgt 1080 -fr 24 \
            --InputBitDepth=8 --InputChromaFormat=420 \
            -f 32 -q "$qp" \
            --MTS=1 --LFNST=0 \
            -b "$out/B1_Kimono1_QP${qp}_anchor_lfnst0.vvc" \
            2>&1 | tee "$out/B1_Kimono1_QP${qp}_anchor_lfnst0.log"

          sha256sum "$out/B1_Kimono1_QP${qp}_anchor_lfnst0.vvc" \
            > "$out/B1_Kimono1_QP${qp}_anchor_lfnst0.sha256"

          {
            echo "Experiment: independent NMF-study anchor"
            echo "Sequence: B1_Kimono1"
            echo "Frames: 32"
            echo "GOPSize: 32"
            echo "QP: $qp"
            echo "VTM: 24.0 repository baseline"
            echo "RandomAccess: 1"
            echo "MTS: 1"
            echo "LFNST: 0"
            echo "CD-SATM/CSSATM: not invoked"
            echo
            grep -E 'SUMMARY|Total Frames|^[[:space:]]*[0-9]+[[:space:]]+a[[:space:]]|Total Time' \
              "$out/B1_Kimono1_QP${qp}_anchor_lfnst0.log" || true
          } | tee "$out/B1_Kimono1_QP${qp}_anchor_lfnst0_summary.txt"

      - name: Upload QP result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmf-anchor-B1-Kimono1-QP${{ matrix.qp }}-LFNST0-32F
          path: |
            nmf_results/anchor/B1_Kimono1/QP${{ matrix.qp }}/*.log
            nmf_results/anchor/B1_Kimono1/QP${{ matrix.qp }}/*.txt
            nmf_results/anchor/B1_Kimono1/QP${{ matrix.qp }}/*.sha256
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Collect anchor summaries
    if: always()
    needs: anchor
    runs-on: ubuntu-latest
    steps:
      - name: Download completed results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nmf-anchor-B1-Kimono1-QP*-LFNST0-32F
          path: summaries
          merge-multiple: true

      - name: Build combined summary
        shell: bash
        run: |
          {
            echo "Independent NMF Study - VTM Anchor"
            echo "Sequence: B1_Kimono1"
            echo "Frames: 32 (one configured GOP)"
            echo "QPs: 22, 27, 32, 37"
            echo "Random Access; MTS=1; LFNST=0"
            echo "No CD-SATM/CSSATM proposed results are used."
            echo
            find summaries -type f -name '*_summary.txt' -print0 2>/dev/null |
              sort -z |
              while IFS= read -r -d '' summary; do
                echo "===== $summary ====="
                cat "$summary"
                echo
              done
          } | tee nmf_anchor_lfnst0_32f_combined_summary.txt

      - name: Upload combined summary
        uses: actions/upload-artifact@v4
        with:
          name: nmf-anchor-B1-Kimono1-LFNST0-32F-combined
          path: nmf_anchor_lfnst0_32f_combined_summary.txt
          retention-days: 30
