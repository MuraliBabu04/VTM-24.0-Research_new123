name: Run VTM Kimono1
# Drive access verified; start the Kimono1 anchor encoding run.

on:
  workflow_dispatch:
    inputs:
      sequence_url:
        description: Google Drive sharing URL for B1_Kimono1_1920x1080_24.yuv
        required: false
        default: https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link
        type: string
      frames:
        description: Number of frames to encode
        required: false
        default: "64"
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/run-vtm-kimono.yml

permissions:
  contents: read

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify compiled Linux VTM encoder
        run: |
          test -f bin/EncoderAppStatic
          chmod +x bin/EncoderAppStatic scripts/*.sh
          test -x bin/EncoderAppStatic
          file bin/EncoderAppStatic

      - name: Download Class B1 Kimono1 from Drive
        env:
          SEQUENCE_URL: ${{ inputs.sequence_url || 'https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link' }}
        run: |
          python3 -m pip install --disable-pip-version-check gdown
          mkdir -p test_sequence
          gdown "$SEQUENCE_URL" -O test_sequence/B1_Kimono1_1920x1080_24.yuv
          actual_size="$(stat -c%s test_sequence/B1_Kimono1_1920x1080_24.yuv)"
          test "$actual_size" -eq 746496000 || {
            echo "Unexpected Kimono1 file size: $actual_size bytes; expected 746496000." >&2
            exit 1
          }

      - name: Run QP 22, 27, 32 and 37
        env:
          FRAMES: ${{ inputs.frames || '64' }}
        run: |
          for qp in 22 27 32 37; do
            scripts/run_anchor_B1_Kimono1.sh "$qp"
          done

      - name: Collect bitrate and PSNR summaries
        run: |
          {
            echo "VTM B1 Kimono1 summaries"
            for log in results/B1_Kimono1/QP*/*.log; do
              echo
              echo "===== $log ====="
              grep -E "SUMMARY|Total Frames|^[[:space:]]*[0-9]+[[:space:]]+a[[:space:]]" "$log" || true
            done
          } | tee results/B1_Kimono1/summary.txt

      - name: Upload logs, bitstreams and summary
        uses: actions/upload-artifact@v4
        with:
          name: VTM-B1-Kimono1-results
          path: results/B1_Kimono1
          retention-days: 30
