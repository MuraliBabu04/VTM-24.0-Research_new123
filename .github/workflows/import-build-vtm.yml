name: Import and build VTM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git rsync

      - name: Import official VTM source
        run: |
          git clone --depth 1 https://vcgit.hhi.fraunhofer.de/jvet/VVCSoftware_VTM.git /tmp/VVCSoftware_VTM
          rsync -a --exclude='.git' --exclude='.github' /tmp/VVCSoftware_VTM/ ./

      - name: Configure VTM
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile VTM
        run: cmake --build build --parallel "$(nproc)"

      - name: Verify Linux executables
        run: |
          test -x bin/EncoderAppStatic
          test -x bin/DecoderAppStatic
          find bin -maxdepth 1 -type f -name '*Static' -ls

      - name: Commit source and Linux executables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf build
          git add -A
          git add -f bin/EncoderAppStatic bin/DecoderAppStatic
          if [ -f bin/BitstreamExtractorAppStatic ]; then
            git add -f bin/BitstreamExtractorAppStatic
          fi

          if git diff --cached --quiet; then
            echo "VTM source and Linux executables are already up to date; nothing to commit."
          else
            git commit -m "Import official VTM source and compiled Linux executables"
            git push origin main
          fi
