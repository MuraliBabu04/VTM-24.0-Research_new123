name: Run Proposed CD-SATM Kimono1
# Linux cloud workflow: standard VTM coding reference plus CD-SATM hardware model.

on:
  workflow_dispatch:
    inputs:
      sequence_url:
        description: Google Drive sharing URL for B1_Kimono1_1920x1080_24.yuv
        required: false
        default: https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link
        type: string
      frames:
        description: Number of frames to encode and model
        required: false
        default: "64"
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/run-proposed-kimono.yml

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Kimono1 input
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download Class B1 Kimono1 from Drive
        env:
          SEQUENCE_URL: ${{ inputs.sequence_url || 'https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link' }}
        run: |
          python3 -m pip install --disable-pip-version-check gdown
          mkdir -p test_sequence
          gdown "$SEQUENCE_URL" -O test_sequence/B1_Kimono1_1920x1080_24.yuv
          actual_size="$(stat -c%s test_sequence/B1_Kimono1_1920x1080_24.yuv)"
          test "$actual_size" -eq 746496000 || {
            echo "Unexpected Kimono1 file size: $actual_size bytes; expected 746496000." >&2
            exit 1
          }

      - name: Share input with parallel QP jobs
        uses: actions/upload-artifact@v4
        with:
          name: B1-Kimono1-input
          path: test_sequence/B1_Kimono1_1920x1080_24.yuv
          retention-days: 1
          compression-level: 0

  proposed:
    name: Proposed QP ${{ matrix.qp }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        qp: [32]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Kimono1 input
        uses: actions/download-artifact@v4
        with:
          name: B1-Kimono1-input
          path: test_sequence

      - name: Verify Linux VTM and scripts
        run: |
          chmod +x bin/EncoderAppStatic scripts/*.sh
          test -x bin/EncoderAppStatic
          test -f test_sequence/B1_Kimono1_1920x1080_24.yuv
          test "$(stat -c%s test_sequence/B1_Kimono1_1920x1080_24.yuv)" -eq 746496000

      - name: Run VTM reference and proposed CD-SATM model
        env:
          FRAMES: ${{ inputs.frames || '64' }}
        run: scripts/run_proposed_B1_Kimono1.sh "${{ matrix.qp }}"

      - name: Upload proposed QP result
        uses: actions/upload-artifact@v4
        with:
          name: proposed-B1-Kimono1-QP${{ matrix.qp }}
          path: results/proposed/B1_Kimono1/QP${{ matrix.qp }}
          retention-days: 30
          compression-level: 0

      - name: Upload proposed QP summary
        uses: actions/upload-artifact@v4
        with:
          name: proposed-summary-B1-Kimono1-QP${{ matrix.qp }}
          path: results/proposed/B1_Kimono1/QP${{ matrix.qp }}/B1_Kimono1_QP${{ matrix.qp }}_combined_summary.txt
          retention-days: 30

  aggregate:
    name: Collect proposed summaries
    if: ${{ always() }}
    needs: proposed
    runs-on: ubuntu-latest

    steps:
      - name: Download all QP summaries
        uses: actions/download-artifact@v4
        with:
          pattern: proposed-summary-B1-Kimono1-QP*
          path: summaries
          merge-multiple: true

      - name: Build combined bitrate, PSNR and power summary
        shell: bash
        run: |
          {
            echo "B1 Kimono1: Standard VTM coding reference + Proposed CD-SATM hardware model"
            echo "QP: 32"
            echo "Frames: ${{ inputs.frames || '64' }}"
            echo "MTS: 1"
            echo "LFNST: 1"
            echo
            echo "Bitrate and PSNR are measured by standard VTM."
            echo "Power and latency are modeled by cdsatm_des_simulator.py."
            echo "A modified Proposed VTM encoder was not supplied."
            echo
            find summaries -type f -name '*_combined_summary.txt' -print0 |
              sort -z |
              while IFS= read -r -d '' summary; do
                echo "===== $summary ====="
                cat "$summary"
                echo
              done
          } | tee proposed_summary.txt

      - name: Upload combined proposed summary
        uses: actions/upload-artifact@v4
        with:
          name: Proposed-CD-SATM-B1-Kimono1-summary
          path: proposed_summary.txt
          retention-days: 30
