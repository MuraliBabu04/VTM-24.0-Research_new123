name: NMF Asymmetric-Rank Verification - Kimono1 - QP32 QP37

on:
  workflow_dispatch:
    inputs:
      sequence_url:
        description: Google Drive URL for B1_Kimono1_1920x1080_24.yuv
        required: false
        default: https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link
        type: string
  push:
    branches: [nmf-asymmetric-rank-qp32-37]
    paths:
      - .github/workflows/run-nmf-asymmetric-kimono-qp32-37.yml

permissions:
  contents: read

concurrency:
  group: nmf-asymmetric-kimono-qp32-37-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build asymmetric-rank NMF encoder
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout asymmetric branch
        uses: actions/checkout@v4

      - name: Verify optimized NMF configuration
        shell: bash
        run: |
          test -f source/Lib/CommonLib/NmfMtsFactors.h
          grep -q 'NMF_FORWARD_MATRIX_SCALE_BITS = 8' source/Lib/CommonLib/NmfMtsFactors.h
          grep -q 'NMF_DCT8_P32_POS_RANK = 8' source/Lib/CommonLib/NmfMtsFactors.h
          grep -q 'NMF_DCT8_P32_NEG_RANK = 6' source/Lib/CommonLib/NmfMtsFactors.h
          grep -q 'NMF_DST7_P32_POS_RANK = 7' source/Lib/CommonLib/NmfMtsFactors.h
          grep -q 'NMF_DST7_P32_NEG_RANK = 7' source/Lib/CommonLib/NmfMtsFactors.h
          grep -q 'POS_RANK, size_t NEG_RANK' source/Lib/CommonLib/TrQuant_EMT.cpp
          grep -q '2 \* NMF_FACTOR_FRACTIONAL_BITS - NMF_FORWARD_MATRIX_SCALE_BITS' source/Lib/CommonLib/TrQuant_EMT.cpp
          ! grep -Ei 'cd[-_]?satm|cssatm' source/Lib/CommonLib/NmfMtsFactors.h \
            source/Lib/CommonLib/TrQuant.cpp source/Lib/CommonLib/TrQuant_EMT.cpp

      - name: Build modified VTM encoder once
        shell: bash
        run: |
          cmake -S . -B build-nmf-asymmetric -DCMAKE_BUILD_TYPE=Release
          cmake --build build-nmf-asymmetric --target EncoderApp --parallel "$(nproc)"
          test -x bin/EncoderAppStatic
          mkdir -p prepared
          cp bin/EncoderAppStatic prepared/EncoderAppNmfAsymmetric

      - name: Download and verify Kimono1 once
        env:
          SEQUENCE_URL: ${{ inputs.sequence_url || 'https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link' }}
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check gdown
          mkdir -p test_sequence
          gdown "$SEQUENCE_URL" -O test_sequence/B1_Kimono1_1920x1080_24.yuv
          test "$(stat -c%s test_sequence/B1_Kimono1_1920x1080_24.yuv)" -eq 746496000

      - name: Upload prepared encoder
        uses: actions/upload-artifact@v4
        with:
          name: nmf-asymmetric-encoder
          path: prepared/EncoderAppNmfAsymmetric
          retention-days: 1
          compression-level: 0

      - name: Upload Kimono1 input
        uses: actions/upload-artifact@v4
        with:
          name: nmf-asymmetric-B1-Kimono1-input
          path: test_sequence/B1_Kimono1_1920x1080_24.yuv
          retention-days: 1
          compression-level: 0

  verify:
    name: Asymmetric NMF QP ${{ matrix.qp }} - 32 Frames
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        qp: [32, 37]
    steps:
      - name: Checkout asymmetric branch
        uses: actions/checkout@v4

      - name: Download prepared encoder
        uses: actions/download-artifact@v4
        with:
          name: nmf-asymmetric-encoder
          path: prepared

      - name: Download Kimono1 input
        uses: actions/download-artifact@v4
        with:
          name: nmf-asymmetric-B1-Kimono1-input
          path: test_sequence

      - name: Run asymmetric-rank NMF VTM
        shell: bash
        run: |
          chmod +x prepared/EncoderAppNmfAsymmetric
          qp="${{ matrix.qp }}"
          out="nmf_results/asymmetric/B1_Kimono1/QP$qp"
          mkdir -p "$out"
          prepared/EncoderAppNmfAsymmetric \
            -c cfg/encoder_randomaccess_vtm.cfg \
            -i test_sequence/B1_Kimono1_1920x1080_24.yuv \
            -wdt 1920 -hgt 1080 -fr 24 \
            --InputBitDepth=8 --InputChromaFormat=420 \
            -f 32 -q "$qp" \
            --MTS=1 --LFNST=0 \
            -b "$out/B1_Kimono1_QP${qp}_nmf_asymmetric_lfnst0.vvc" \
            2>&1 | tee "$out/B1_Kimono1_QP${qp}_nmf_asymmetric_lfnst0.log"

          sha256sum "$out/B1_Kimono1_QP${qp}_nmf_asymmetric_lfnst0.vvc" \
            > "$out/B1_Kimono1_QP${qp}_nmf_asymmetric_lfnst0.sha256"
          {
            echo "Experiment: scale-corrected asymmetric positive/negative NMF"
            echo "Sequence: B1_Kimono1"
            echo "Frames: 32"
            echo "GOPSize: 32"
            echo "QP: $qp"
            echo "RandomAccess: 1"
            echo "MTS: 1"
            echo "LFNST: 0"
            echo "DCT8 ranks: P8=(1,2), P16=(4,3), P32=(8,6)"
            echo "DST7 ranks: P8=(2,1), P16=(3,4), P32=(7,7)"
            echo "Multiplication savings: P8=25%, P16=12.5%, P32=12.5%"
            echo "Factor fractional bits: 8"
            echo "Restored forward-matrix scale bits: 8"
            echo "Row-gain calibration: enabled and absorbed into W"
            echo "Inverse transform: normative VTM"
            echo "CD-SATM/CSSATM: not invoked"
            echo
            grep -E 'SUMMARY|Total Frames|^[[:space:]]*[0-9]+[[:space:]]+a[[:space:]]|Total Time' \
              "$out/B1_Kimono1_QP${qp}_nmf_asymmetric_lfnst0.log" || true
          } | tee "$out/B1_Kimono1_QP${qp}_nmf_asymmetric_lfnst0_summary.txt"

      - name: Upload QP result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmf-asymmetric-B1-Kimono1-QP${{ matrix.qp }}-LFNST0-32F
          path: |
            nmf_results/asymmetric/B1_Kimono1/QP${{ matrix.qp }}/*.log
            nmf_results/asymmetric/B1_Kimono1/QP${{ matrix.qp }}/*.txt
            nmf_results/asymmetric/B1_Kimono1/QP${{ matrix.qp }}/*.sha256
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Collect asymmetric QP32 and QP37 summaries
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download completed results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nmf-asymmetric-B1-Kimono1-QP*-LFNST0-32F
          path: summaries
          merge-multiple: true

      - name: Build comparison summary
        shell: bash
        run: |
          {
            echo "Scale-Corrected Asymmetric NMF MTS Verification"
            echo "Sequence: B1_Kimono1; Frames: 32; Random Access; MTS=1; LFNST=0"
            echo "Verification QPs: 32, 37"
            echo
            echo "Matching anchor references:"
            echo "QP32: 1031.5860 kb/s; Y 37.5103; U 40.6433; V 42.7146; YUV 38.4230"
            echo "QP37: 499.9080 kb/s; Y 34.8490; U 39.6294; V 41.0330; YUV 35.9459"
            echo
            echo "Equal-rank scale-corrected references:"
            echo "QP32: 1046.3340 kb/s; Y 37.4875; U 40.6516; V 42.7012; YUV 38.4024"
            echo "QP37: 505.7040 kb/s; Y 34.8314; U 39.6230; V 40.9820; YUV 35.9251"
            echo
            find summaries -type f -name '*_summary.txt' -print0 2>/dev/null |
              sort -z |
              while IFS= read -r -d '' summary; do
                echo "===== $summary ====="
                cat "$summary"
                echo
              done
            echo "Two QPs verify the design; four QPs remain required for final BD-rate."
          } | tee nmf_asymmetric_qp32_qp37_summary.txt

      - name: Upload combined summary
        uses: actions/upload-artifact@v4
        with:
          name: nmf-asymmetric-B1-Kimono1-QP32-QP37-LFNST0-32F-combined
          path: nmf_asymmetric_qp32_qp37_summary.txt
          retention-days: 30
