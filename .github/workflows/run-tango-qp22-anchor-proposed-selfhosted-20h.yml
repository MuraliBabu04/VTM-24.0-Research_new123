name: Run Tango2 QP22 Anchor + Proposed - Self-hosted 20h

on:
  workflow_dispatch:
    inputs:
      frames:
        description: Frames for Tango2 QP22 runs
        required: true
        default: "32"
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/run-tango-qp22-anchor-proposed-selfhosted-20h.yml

permissions:
  contents: read

concurrency:
  group: tango-qp22-anchor-proposed-selfhosted-20h-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-input:
    name: Prepare Tango2 32-frame input
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract Tango2 input
        env:
          SEQUENCE_URL: https://drive.google.com/file/d/1UYRKYgN51OX1cpVHq-TCtJe-qo0YDuq1/view
          FRAMES: ${{ inputs.frames || '32' }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check gdown
          python3 scripts/prepare_class_a1_tango_input.py \
            --url "$SEQUENCE_URL" \
            --output Test_Sequences/Tango2_3840x2160_60fps_10bit_420.yuv \
            --frames "$FRAMES"

      - name: Upload Tango2 input
        uses: actions/upload-artifact@v4
        with:
          name: tango2-qp22-${{ inputs.frames || '32' }}f-input
          path: Test_Sequences/Tango2_3840x2160_60fps_10bit_420.yuv
          retention-days: 1
          compression-level: 0

  build-vtm:
    name: Build VTM-24.0 encoder
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build EncoderApp
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target EncoderApp --parallel 2
          test -x bin/EncoderAppStatic

      - name: Upload VTM encoder
        uses: actions/upload-artifact@v4
        with:
          name: tango2-qp22-vtm-encoder
          path: bin/EncoderAppStatic
          retention-days: 1
          compression-level: 0

  anchor:
    name: Anchor Tango2 QP22 - 20h
    needs: [prepare-input, build-vtm]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1200
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VTM encoder
        uses: actions/download-artifact@v4
        with:
          name: tango2-qp22-vtm-encoder
          path: instrumented-vtm

      - name: Download Tango2 input
        uses: actions/download-artifact@v4
        with:
          name: tango2-qp22-${{ inputs.frames || '32' }}f-input
          path: Test_Sequences

      - name: Run Anchor Tango2 QP22
        env:
          VTM_ENCODER: ${{ github.workspace }}/instrumented-vtm/EncoderAppStatic
        run: |
          set -euo pipefail
          chmod +x "$VTM_ENCODER" scripts/run_anchor_ctc_sequence.sh
          scripts/run_anchor_ctc_sequence.sh A1_Tango 22 "${{ inputs.frames || '32' }}"

      - name: Add anchor summary
        if: always()
        run: |
          summary="results/Anchor/Class_A1/A1_Tango/QP22/A1_Tango_QP22_anchor_summary.txt"
          if [[ -f "$summary" ]]; then
            {
              echo '```text'
              cat "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload anchor result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-A1-Tango-QP22-${{ inputs.frames || '32' }}f-selfhosted
          path: results/Anchor/Class_A1/A1_Tango/QP22/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  proposed:
    name: Proposed Tango2 QP22 CD-SATM - 20h
    needs: [prepare-input, build-vtm]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1200
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download measured VTM encoder
        uses: actions/download-artifact@v4
        with:
          name: tango2-qp22-vtm-encoder
          path: instrumented-vtm

      - name: Download Tango2 input
        uses: actions/download-artifact@v4
        with:
          name: tango2-qp22-${{ inputs.frames || '32' }}f-input
          path: Test_Sequences

      - name: Run Proposed Tango2 QP22 with CD-SATM tracing
        env:
          VTM_ENCODER: ${{ github.workspace }}/instrumented-vtm/EncoderAppStatic
        run: |
          set -euo pipefail
          chmod +x "$VTM_ENCODER" scripts/run_proposed_class_a1_tango.sh
          scripts/run_proposed_class_a1_tango.sh 22 "${{ inputs.frames || '32' }}"

      - name: Add proposed CD-SATM summary
        if: always()
        run: |
          summary="results/Class_A1/A1_Tango/QP22/A1_Tango_QP22_summary.txt"
          if [[ -f "$summary" ]]; then
            {
              echo '```text'
              cat "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload proposed measured result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposed-A1-Tango-QP22-measured-${{ inputs.frames || '32' }}f-selfhosted
          path: results/Class_A1/A1_Tango/QP22/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
