name: Paper 5 BD-rate missing 17 anchors MTS1 LFNST0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paper5-pilot-anchor-mts1-lfnst0.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper5-primary-anchor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ matrix.sequence }} ${{ matrix.frames }} frames
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {sequence: A1_Tango, cls: A1, file: Tango2_3840x2160_60fps_10bit_420.yuv, frames: 32, url: "https://drive.google.com/file/d/1UYRKYgN51OX1cpVHq-TCtJe-qo0YDuq1/view", hash: "-"}
          - {sequence: B1_Kimono1, cls: B, file: B1_Kimono1_1920x1080_24.yuv, frames: 32, url: "https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view", hash: "-"}
          - {sequence: C1_RaceHorses, cls: C, file: C1_RaceHorses_832x480_30.yuv, frames: 96, url: "https://drive.google.com/file/d/1d8FMx_LEGCNSPlY5pu_o5x69Se9lZhkQ/view", hash: "-"}
          - {sequence: C2_BQMall, cls: C, file: C2_BQMall_832x480_60.yuv, frames: 96, url: "https://drive.google.com/file/d/1dEfl5qIhzokM-mZWVwpCESdefzh2pPji/view", hash: "-"}
          - {sequence: C3_PartyScene, cls: C, file: C3_PartyScene_832x480_50.yuv, frames: 96, url: "https://drive.google.com/file/d/1_l7Zr3edEHhFGulnYUvUM16hcNTOxz60/view", hash: "-"}
          - {sequence: D1_RaceHorses, cls: D, file: D1_RaceHorses_416x240_30.yuv, frames: 64, url: "-", hash: "7192decb5ab38d0367afcce4c3ca77c6fc06b11d0d50de2c27eceda8ecd24951"}
          - {sequence: D2_BQSquare, cls: D, file: D2_BQSquare_416x240_60.yuv, frames: 64, url: "-", hash: "2ea8a868496358ab11761fca9b524eb169b369fe933472650bc499262b31e374"}
          - {sequence: D3_BlowingBubbles, cls: D, file: D3_BlowingBubbles_416x240_50.yuv, frames: 64, url: "-", hash: "34de0fb4fb637a53994cfc67db8b22d01fe9b54e207db20d25683e72789682d5"}
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact Paper 2 frame count
        shell: bash
        env:
          SEQ: ${{ matrix.sequence }}
          FILE: ${{ matrix.file }}
          FRAMES: ${{ matrix.frames }}
          URL: ${{ matrix.url }}
          SHA256: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          mkdir -p Test_Sequences
          case "$SEQ" in
            A1_Tango)
              python3 -m pip install --disable-pip-version-check gdown
              python3 scripts/prepare_class_a1_tango_input.py --url "$URL" --output "Test_Sequences/$FILE" --frames "$FRAMES"
              ;;
            B1_Kimono1)
              python3 -m pip install --disable-pip-version-check gdown
              python3 scripts/prepare_class_b_input.py --url "$URL" --output "Test_Sequences/$FILE" --frames "$FRAMES"
              ;;
            C1_RaceHorses|C2_BQMall|C3_PartyScene)
              python3 -m pip install --disable-pip-version-check gdown
              python3 scripts/prepare_class_c_input.py --url "$URL" --output "Test_Sequences/$FILE" --frames "$FRAMES"
              ;;
            D1_RaceHorses|D2_BQSquare|D3_BlowingBubbles)
              for part in test_sequences/class_d/"${FILE}".gz.b64.part*.b64; do
                base64 --decode "$part"
              done | gzip -dc > "Test_Sequences/$FILE"
              test "$(stat -c%s "Test_Sequences/$FILE")" -eq 9584640
              echo "$SHA256  Test_Sequences/$FILE" | sha256sum --check --strict
              ;;
            *) echo "Unsupported sequence: $SEQ" >&2; exit 2 ;;
          esac
          test -s "Test_Sequences/$FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: paper5-pilot-input-${{ matrix.sequence }}
          path: Test_Sequences/${{ matrix.file }}
          retention-days: 1
          compression-level: 0

  build:
    name: Build stock VTM-24.0 encoder
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Compile official VTM path
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target EncoderApp --parallel 2
          test -x bin/EncoderAppStatic
      - uses: actions/upload-artifact@v4
        with:
          name: paper5-pilot-stock-encoder
          path: bin/EncoderAppStatic
          retention-days: 1
          compression-level: 0

  anchor:
    name: BD-rate Anchor ${{ matrix.sequence }} QP${{ matrix.qp }} MTS1 LFNST0
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {sequence: A1_Tango, cls: A1, qp: 27, frames: 32}
          - {sequence: A1_Tango, cls: A1, qp: 32, frames: 32}
          - {sequence: B1_Kimono1, cls: B, qp: 27, frames: 32}
          - {sequence: B1_Kimono1, cls: B, qp: 37, frames: 32}
          - {sequence: C1_RaceHorses, cls: C, qp: 27, frames: 96}
          - {sequence: C1_RaceHorses, cls: C, qp: 32, frames: 96}
          - {sequence: C2_BQMall, cls: C, qp: 27, frames: 96}
          - {sequence: C2_BQMall, cls: C, qp: 32, frames: 96}
          - {sequence: C3_PartyScene, cls: C, qp: 27, frames: 96}
          - {sequence: C3_PartyScene, cls: C, qp: 32, frames: 96}
          - {sequence: D1_RaceHorses, cls: D, qp: 27, frames: 64}
          - {sequence: D1_RaceHorses, cls: D, qp: 32, frames: 64}
          - {sequence: D2_BQSquare, cls: D, qp: 27, frames: 64}
          - {sequence: D2_BQSquare, cls: D, qp: 32, frames: 64}
          - {sequence: D3_BlowingBubbles, cls: D, qp: 27, frames: 64}
          - {sequence: D3_BlowingBubbles, cls: D, qp: 32, frames: 64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paper5-pilot-stock-encoder
          path: stock-bin
      - uses: actions/download-artifact@v4
        with:
          name: paper5-pilot-input-${{ matrix.sequence }}
          path: Test_Sequences
      - name: Run VTM anchor with identical Paper 5 tool settings
        env:
          VTM_ENCODER: ${{ github.workspace }}/stock-bin/EncoderAppStatic
          VTM_MTS: "1"
          VTM_LFNST: "0"
          RESULT_DIR: ${{ github.workspace }}/results/Paper5/Anchor/${{ matrix.sequence }}/QP${{ matrix.qp }}
        run: |
          set -euo pipefail
          chmod +x "$VTM_ENCODER" scripts/run_anchor_ctc_sequence.sh
          scripts/run_anchor_ctc_sequence.sh "${{ matrix.sequence }}" "${{ matrix.qp }}" "${{ matrix.frames }}"
          grep -qx 'MTS: 1' "$RESULT_DIR/${{ matrix.sequence }}_QP${{ matrix.qp }}_anchor_summary.txt"
          grep -qx 'LFNST: 0' "$RESULT_DIR/${{ matrix.sequence }}_QP${{ matrix.qp }}_anchor_summary.txt"
      - name: Upload measured anchor outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper5-anchor-${{ matrix.sequence }}-QP${{ matrix.qp }}-${{ matrix.frames }}f
          path: results/Paper5/Anchor/${{ matrix.sequence }}/QP${{ matrix.qp }}/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
