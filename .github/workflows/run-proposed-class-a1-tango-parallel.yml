name: Run Proposed CD-SATM A1 Tango - QPs in Parallel

on:
  workflow_dispatch:
    inputs:
      frames:
        description: Frames per QP run
        required: true
        default: "32"
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/run-proposed-class-a1-tango-parallel.yml

permissions:
  contents: read

concurrency:
  group: proposed-class-a1-tango-parallel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-input:
    name: Prepare A1 Tango input
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract exactly 32 4K 10-bit frames
        env:
          SEQUENCE_URL: https://drive.google.com/file/d/1UYRKYgN51OX1cpVHq-TCtJe-qo0YDuq1/view
          FRAMES: ${{ inputs.frames || '32' }}
        run: |
          python3 -m pip install --disable-pip-version-check gdown
          python3 scripts/prepare_class_a1_tango_input.py \
            --url "$SEQUENCE_URL" \
            --output Test_Sequences/Tango2_3840x2160_60fps_10bit_420.yuv \
            --frames "$FRAMES"
      - uses: actions/upload-artifact@v4
        with:
          name: class-a1-tango-${{ inputs.frames || '32' }}f
          path: Test_Sequences/Tango2_3840x2160_60fps_10bit_420.yuv
          retention-days: 1
          compression-level: 0

  build-vtm:
    name: Build measured VTM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build EncoderApp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target EncoderApp --parallel 2
          test -x bin/EncoderAppStatic
      - uses: actions/upload-artifact@v4
        with:
          name: measured-vtm-encoder-class-a1
          path: bin/EncoderAppStatic
          retention-days: 1

  encode:
    name: A1 Tango QP${{ matrix.qp }}
    needs: [prepare-input, build-vtm]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        qp: [22, 27, 37]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: measured-vtm-encoder-class-a1
          path: instrumented-vtm
      - uses: actions/download-artifact@v4
        with:
          name: class-a1-tango-${{ inputs.frames || '32' }}f
          path: Test_Sequences
      - name: Run independent A1 Tango QP job
        env:
          VTM_ENCODER: ${{ github.workspace }}/instrumented-vtm/EncoderAppStatic
        run: |
          chmod +x "$VTM_ENCODER" scripts/run_proposed_class_a1_tango.sh
          scripts/run_proposed_class_a1_tango.sh "${{ matrix.qp }}" "${{ inputs.frames || '32' }}"
      - name: Add QP summary
        if: always()
        run: |
          summary="results/Class_A1/A1_Tango/QP${{ matrix.qp }}/A1_Tango_QP${{ matrix.qp }}_summary.txt"
          if [[ -f "$summary" ]]; then
            {
              echo '```text'
              sed -n '1,$p' "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload QP result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposed-A1-Tango-QP${{ matrix.qp }}-measured
          path: results/Class_A1/A1_Tango/QP${{ matrix.qp }}/
          if-no-files-found: warn
          retention-days: 30
