name: NMF Exact8 Hybrid Verification - Kimono1 - QP32 QP37

on:
  workflow_dispatch:
    inputs:
      sequence_url:
        description: Google Drive URL for B1_Kimono1_1920x1080_24.yuv
        required: false
        default: https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link
        type: string
  push:
    branches: [nmf-exact8-hybrid-qp32-37]
    paths:
      - .github/workflows/run-nmf-exact8-hybrid-kimono-qp32-37.yml

permissions:
  contents: read

concurrency:
  group: nmf-exact8-hybrid-kimono-qp32-37-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build exact8 hybrid NMF encoder
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout hybrid branch
        uses: actions/checkout@v4

      - name: Verify hybrid configuration
        shell: bash
        run: |
          test -f source/Lib/CommonLib/NmfMtsFactors.h
          grep -q 'NMF_FORWARD_MATRIX_SCALE_BITS = 8' source/Lib/CommonLib/NmfMtsFactors.h
          grep -q '2 \* NMF_FACTOR_FRACTIONAL_BITS - NMF_FORWARD_MATRIX_SCALE_BITS' source/Lib/CommonLib/TrQuant_EMT.cpp
          grep -q 'hybridForwardDCT8_B8' source/Lib/CommonLib/TrQuant.cpp
          grep -q 'hybridForwardDST7_B8' source/Lib/CommonLib/TrQuant.cpp
          ! grep -q 'nmfForward.*_B8' source/Lib/CommonLib/TrQuant.cpp
          grep -q 'nmfForwardDCT8_B32' source/Lib/CommonLib/TrQuant.cpp
          ! grep -Ei 'cd[-_]?satm|cssatm' source/Lib/CommonLib/NmfMtsFactors.h \
            source/Lib/CommonLib/TrQuant.cpp source/Lib/CommonLib/TrQuant_EMT.cpp

      - name: Build modified VTM encoder once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prepared
          cmake -S . -B build-nmf-hybrid -DCMAKE_BUILD_TYPE=Release -DNMF_VERIFY=ON
          cmake --build build-nmf-hybrid --target EncoderApp NmfTransformCheck --parallel "$(nproc)"
          NMF_AUDIT=1 "$(cat build-nmf-hybrid/nmf-check-Release.path)" 2>&1 | tee prepared/transform-check.log
          encoder="$(cat build-nmf-hybrid/nmf-encoder-Release.path)"
          test -x "$encoder"
          cp "$encoder" prepared/EncoderAppNmfHybrid
          cmp "$encoder" prepared/EncoderAppNmfHybrid
          sha256sum prepared/EncoderAppNmfHybrid source/Lib/CommonLib/NmfMtsFactors.h \
            source/Lib/CommonLib/TrQuant_EMT.cpp cfg/encoder_randomaccess_vtm.cfg > prepared/build.sha256
          git rev-parse HEAD > prepared/commit.txt
          c++ --version > prepared/compiler.txt

      - name: Download and verify Kimono1 once
        env:
          SEQUENCE_URL: ${{ inputs.sequence_url || 'https://drive.google.com/file/d/1843eyCx362pJgZ1BWzBSPLzsqIsD4fmC/view?usp=drive_link' }}
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check gdown
          mkdir -p test_sequence
          gdown "$SEQUENCE_URL" -O test_sequence/B1_Kimono1_1920x1080_24.yuv
          test "$(stat -c%s test_sequence/B1_Kimono1_1920x1080_24.yuv)" -eq 746496000

      - name: Upload prepared encoder
        uses: actions/upload-artifact@v4
        with:
          name: nmf-exact8-hybrid-encoder
          path: prepared/
          retention-days: 1
          compression-level: 0

      - name: Upload Kimono1 input
        uses: actions/upload-artifact@v4
        with:
          name: nmf-exact8-hybrid-B1-Kimono1-input
          path: test_sequence/B1_Kimono1_1920x1080_24.yuv
          retention-days: 1
          compression-level: 0

  verify:
    name: Exact8 Hybrid NMF QP ${{ matrix.qp }} - 32 Frames
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        qp: [32, 37]
    steps:
      - name: Checkout hybrid branch
        uses: actions/checkout@v4

      - name: Download prepared encoder
        uses: actions/download-artifact@v4
        with:
          name: nmf-exact8-hybrid-encoder
          path: prepared

      - name: Download Kimono1 input
        uses: actions/download-artifact@v4
        with:
          name: nmf-exact8-hybrid-B1-Kimono1-input
          path: test_sequence

      - name: Run exact8 hybrid NMF VTM
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c prepared/build.sha256
          chmod +x prepared/EncoderAppNmfHybrid
          qp="${{ matrix.qp }}"
          out="nmf_results/exact8_hybrid/B1_Kimono1/QP$qp"
          mkdir -p "$out"
          NMF_AUDIT=1 prepared/EncoderAppNmfHybrid \
            -c cfg/encoder_randomaccess_vtm.cfg \
            -i test_sequence/B1_Kimono1_1920x1080_24.yuv \
            -wdt 1920 -hgt 1080 -fr 24 \
            --InputBitDepth=8 --InputChromaFormat=420 \
            -f 32 -q "$qp" \
            --MTS=1 --LFNST=0 \
            -b "$out/B1_Kimono1_QP${qp}_nmf_exact8_hybrid_lfnst0.vvc" \
            2>&1 | tee "$out/B1_Kimono1_QP${qp}_nmf_exact8_hybrid_lfnst0.log"

          python3 nmf_experiment/summarize_hybrid.py "$out/B1_Kimono1_QP${qp}_nmf_exact8_hybrid_lfnst0.log" "$qp" | tee "$out/metrics_QP${qp}.json"
          cp prepared/commit.txt "$out/commit_QP${qp}.txt"
          cp prepared/build.sha256 "$out/build_QP${qp}.sha256"
          sha256sum "$out/B1_Kimono1_QP${qp}_nmf_exact8_hybrid_lfnst0.vvc" \
            > "$out/B1_Kimono1_QP${qp}_nmf_exact8_hybrid_lfnst0.sha256"
          {
            echo "Experiment: exact N8 + corrected equal-rank NMF N16/N32"
            echo "Sequence: B1_Kimono1"
            echo "Frames: 32"
            echo "GOPSize: 32"
            echo "QP: $qp"
            echo "RandomAccess: 1"
            echo "MTS: 1"
            echo "LFNST: 0"
            echo "NMF ranks per sign: size16=3, size32=6; size4/size8=normative"
            echo "Factor fractional bits: 8"
            echo "Restored forward-matrix scale bits: 8"
            echo "Inverse transform: normative VTM"
            echo "CD-SATM/CSSATM: not invoked"
            echo
            grep -E 'SUMMARY|Total Frames|^[[:space:]]*[0-9]+[[:space:]]+a[[:space:]]|Total Time' \
              "$out/B1_Kimono1_QP${qp}_nmf_exact8_hybrid_lfnst0.log" || true
          } | tee "$out/B1_Kimono1_QP${qp}_nmf_exact8_hybrid_lfnst0_summary.txt"

      - name: Upload QP result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmf-exact8-hybrid-B1-Kimono1-QP${{ matrix.qp }}-LFNST0-32F
          path: |
            nmf_results/exact8_hybrid/B1_Kimono1/QP${{ matrix.qp }}/*.log
            nmf_results/exact8_hybrid/B1_Kimono1/QP${{ matrix.qp }}/*.txt
            nmf_results/exact8_hybrid/B1_Kimono1/QP${{ matrix.qp }}/*.json
            nmf_results/exact8_hybrid/B1_Kimono1/QP${{ matrix.qp }}/*.sha256
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Collect QP32 and QP37 verification summaries
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download completed results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nmf-exact8-hybrid-B1-Kimono1-QP*-LFNST0-32F
          path: summaries
          merge-multiple: true

      - name: Build comparison summary
        shell: bash
        run: |
          {
            echo "Exact8 Hybrid Fixed-Point NMF MTS Verification"
            echo "Sequence: B1_Kimono1; Frames: 32; Random Access; MTS=1; LFNST=0"
            echo "Verification QPs: 32, 37"
            echo
            echo "Existing matching anchor references:"
            echo "QP32: 1031.5860 kb/s; Y 37.5103; U 40.6433; V 42.7146; YUV 38.4230"
            echo "QP37: 499.9080 kb/s; Y 34.8490; U 39.6294; V 41.0330; YUV 35.9459"
            echo
            find summaries -type f -name '*_summary.txt' -print0 2>/dev/null |
              sort -z |
              while IFS= read -r -d '' summary; do
                echo "===== $summary ====="
                cat "$summary"
                echo
              done
            echo "Two QPs screen the hybrid; four QPs remain required for final BD-rate."
          } | tee nmf_exact8_hybrid_qp32_qp37_summary.txt

      - name: Upload combined summary
        uses: actions/upload-artifact@v4
        with:
          name: nmf-exact8-hybrid-B1-Kimono1-QP32-QP37-LFNST0-32F-combined
          path: nmf_exact8_hybrid_qp32_qp37_summary.txt
          retention-days: 30
